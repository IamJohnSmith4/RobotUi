<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ถึงจุดหมายแล้ว — ห้อง {{ room_id }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/arrived.css') }}">
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="grid"></div>
    <div class="scan"></div>

    <div class="br tl"></div>
    <div class="br tr"></div>
    <div class="br bl"></div>
    <div class="br br2"></div>

    <div class="page">
        <div class="text-block">
            <span class="arrived-title">ARRIVED</span>
            <span class="room-label">ห้อง {{ room_id.upper() }}</span>
        </div>

        <div class="video-container">
            {% if room_info.youtube_id %}
            <iframe
                src="https://www.youtube.com/embed/{{ room_info.youtube_id }}?autoplay=1&mute=1&loop=1&playlist={{ room_info.youtube_id }}"
                allow="autoplay; encrypted-media" allowfullscreen>
            </iframe>
            {% else %}
            <div class="no-video"
                style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted);">
                <i class="fas fa-video-slash" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <p>ไม่มีวิดีโอแนะนำสำหรับห้องนี้</p>
            </div>
            {% endif %}
        </div>

        <div class="info-card">
            <div class="info-label">
                <span><i class="fas fa-info-circle"></i> รายละเอียดห้อง</span>
                <button onclick="speakDetails()"
                    style="background:none; border:none; color:var(--cyan); cursor:pointer; font-size:1.2rem; float:right;">
                    <i class="fas fa-volume-up"></i> ฟังเสียงบรรยาย
                </button>
            </div>
            <div class="info-text">{{ room_info.desc }}</div>

            <div class="details-section">
                <p><strong><i class="fas fa-graduation-cap"></i> สาขาวิชา:</strong> {{ room_info.dept }}</p>
                <p><strong><i class="fas fa-book"></i> รายวิชาที่เกี่ยวข้อง:</strong> {{ room_info.subjects }}</p>
            </div>
        </div>

        <div class="action-buttons">
            <button onclick="returnToRoom()" class="btn btn-secondary">
                <i class="fas fa-th"></i> เลือกห้องอื่น
            </button>
            <button onclick="sendHome()" class="btn btn-primary">
                <i class="fas fa-rotate-left"></i> ส่งหุ่นกลับจุดเริ่มต้น
            </button>
        </div>
    </div>

    <script>
        const room_id = "{{ room_id }}";
        const ROOM_ID = "{{ room_id }}";
        
        // 🟢 เพิ่มบรรทัดนี้: ดึงข้อความบรรยายจาก Python มาใส่ใน JS
        // ใช้ | safe เพื่อป้องกันปัญหาภาษาไทยหรืออักขระพิเศษ
        const DUB_TEXT = `{{ room_info.dub | safe }}`; 

        window.addEventListener('DOMContentLoaded', () => {
            // หน่วงเวลาเล็กน้อยเพื่อให้เบราว์เซอร์เตรียมระบบเสียง
            setTimeout(() => {
                speakDetails();
            }, 500);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/arrived.js') }}"></script>
</body>

</html>
