<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แผนที่อาคาร — ห้อง {{ room_id }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/view_map.css') }}">
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="grid"></div>

    <div class="page">
        <div class="header">
            <span>Navigation Route</span>
            <h1><i class="fas fa-map-marked-alt"></i> ห้อง {{ room_id }}</h1>
        </div>

        <div class="map-frame">
            <div class="map-wrapper" id="map-wrapper">
                <img src="{{ url_for('static', filename='img/map.png') }}" alt="แผนที่อาคาร" class="map-image">
                <svg id="route-layer" class="route-layer" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
        </div>
    </div>

    <script>
        const START_ROOM = "{{ start_room if start_room else 'HOME' }}"; 
        const DEST_ROOM = "{{ room_id.upper() }}";
    </script>
    <script src="{{ url_for('static', filename='js/view_map.js') }}"></script>
</body>
</html>
